<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="JevSEO">
  <!-- Three bars at three different lengths: the SEO, AEO and GEO scores that
       are the whole point of the tool. Legible at 16px, which a monogram or a
       thin outline mark would not be. -->
  <rect width="32" height="32" rx="7" fill="#1f4788"/>
  <rect x="7"  y="8"  width="18" height="4" rx="2" fill="#fbfaf8"/>
  <rect x="7"  y="14" width="12" height="4" rx="2" fill="#fbfaf8" opacity="0.82"/>
  <rect x="7"  y="20" width="7"  height="4" rx="2" fill="#fbfaf8" opacity="0.64"/>
</svg>
